# 비상로지스 DB를 유그린 나스에 매일 자동 백업 (UGOS Docker > 프로젝트 > 만들기에 그대로 붙여 넣기)
# - DATABASE_URL 한 줄만 바꾸면 된다 (안내: README.md 2단계)
# - 매일 새벽 3시(한국)에 backups 폴더에 bisang_날짜.dump 파일 하나, 30일 지난 파일은 지운다
# - 컨테이너를 처음 켜면 바로 한 번 백업해서 잘 되는지 확인할 수 있다
services:
  bisang-backup:
    image: postgres:17-alpine
    container_name: bisang-backup
    restart: unless-stopped
    environment:
      TZ: Asia/Seoul
      DATABASE_URL: "여기에_Supabase_연결_주소를_붙여_넣기"
      BACKUP_HOUR: "03"
      KEEP_DAYS: "30"
    volumes:
      - ./backups:/backups
    command:
      - /bin/sh
      - -c
      - |
        backup() {
          f="/backups/bisang_$$(date +%Y-%m-%d_%H%M).dump"
          echo "[$$(date '+%F %T')] 백업 시작"
          if pg_dump "$$DATABASE_URL" --schema=public --no-owner --no-privileges -Fc -f "$$f.part"; then
            mv "$$f.part" "$$f"
            echo "[$$(date '+%F %T')] 백업 완료: $$f ($$(du -h "$$f" | cut -f1))"
          else
            echo "[$$(date '+%F %T')] 백업 실패 — 연결 주소·비밀번호를 확인하세요"
          fi
          find /backups -name 'bisang_*' -mtime +$$KEEP_DAYS -delete
        }
        backup
        last="$$(date +%F)"
        while true; do
          if [ "$$(date +%H)" = "$$BACKUP_HOUR" ] && [ "$$(date +%F)" != "$$last" ]; then
            backup
            last="$$(date +%F)"
          fi
          sleep 600
        done
